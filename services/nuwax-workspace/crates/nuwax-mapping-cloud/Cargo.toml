[package]
name = "nuwax-mapping-cloud"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "nuwax 地图云服务"

[dependencies]
nuwax-types = { path = "../nuwax-types" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
osmpbf = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

# P1 #5 (rework22 Lane D): cloud 依赖 Google Maps API key,
# Go2 单机部署不需要,一律默认禁用。开启 `cloud-enabled` 时可显式打开
# (例如开发 / 调试阶段)。`Disabled` 错误码会在 feature off 时返给调用方。
[features]
default = []
cloud-enabled = []