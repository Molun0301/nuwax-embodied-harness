[package]
name = "nuwax-nav-basic-path-follower"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "纯 Rust 轻量路径跟随控制器（纯算法，不依赖 C++ path_follower）"

[dependencies]
# Foundation 共享类型 — 接入后允许跨 crate 共享 PoseStamped / Twist2 / ControllerCommand
nuwax-nav-types-messages = { path = "../nuwax-nav-types-messages" }
nuwax-nav-base = { path = "../nuwax-nav-base" }

nuwax-numeric = { path = "../nuwax-numeric" }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
approx = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "sync", "test-util"] }
