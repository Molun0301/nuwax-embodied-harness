syntax = "proto3";
package nuwax.geometry.v3;

// ============================================================================
// Geometry（几何运行时）对外接口契约 v3（F0 草案，冻结后由车道 B2 实现 Rust、车道 Python 实现 client.py）
//
// 对应：目标架构 6.2（会话状态机）、6.3（地图目录）、6.4（远程接口）、6.5（导航目标）。
// 传输：gRPC，127.0.0.1:${NUWAX_GEOMETRY_RUNTIME_PORT}（默认 50051）。
// 进程就绪：Rust 只写一个就绪文件（${NUWAX_GEOMETRY_RUNTIME_READY_FILE}），gRPC 能接受连接后写入，
//          进程退出时删除；业务监督者 ensure(["geometry"]) 以它为准。本接口没有健康检查 RPC。
//
// 通用规则
// 1. 唯一状态拥有方：会话阶段、当前地图、位姿、当前导航目标、探索任务都只在 Geometry；
//    调用方读 GetState/SubscribeState，不保存副本，不比对代际或修订号。
// 2. 控制命令（Start/Stop/Save/Load/Relocalize/SetGoal/CancelGoal/StartExploration/StopExploration）
//    由 Geometry 内一个命令队列按到达顺序执行；RPC 在命令执行完、新状态已发布之后返回。
//    实时传感器帧不进命令队列。
// 3. 人的命令优先：新的 StartMapping / LoadMap 直接结束当前状态，不要求先停；
//    新的 SetGoal 替换旧目标并结束探索。
// 4. 错误只用 gRPC 状态码表达，原因写在 status message（中文，可直接展示给用户）：
//      FAILED_PRECONDITION  当前会话状态不允许该命令（例如未定位时 SetGoal）
//      NOT_FOUND            地图不存在
//      ALREADY_EXISTS       保存或新建时地图名已被占用
//      INVALID_ARGUMENT     消息内容不合法（解码处唯一一次校验）
//      DATA_LOSS            地图目录内的文件损坏或不完整（原因写明文件）
//      UNAVAILABLE          所需子系统故障或未运行（原生 LIO、建图后端、PGO、导航栈）
//      INTERNAL             程序缺陷
//    “重定位没有匹配上”“导航失败”等业务结果不是 RPC 错误，写在状态与返回消息里。
// 5. 地图名：调用方（网关入口）已按命名规则校验，直接作为目录名使用：
//    1–64 个字符；不含 '/'、'\0'、控制字符；不以 '.' 开头。Geometry 解码处再拒绝一次（INVALID_ARGUMENT）。
// 6. 地图目录 ${NUWAX_MAP_CATALOG_ROOT}/<地图名>/：
//      geometry/              只由 Geometry 写（检查点、占据栅格、点云、精细/稠密云），先写临时目录再整体替换
//      meta.json              只由网关写（显示名、地理参考、创建/更新时间）
//      forbidden_zones.json   只由网关写；Geometry 读取并监视变化（见待决问题 Q4）
// 7. 坐标：位姿与目标都用地图坐标系（GetState.info.map_frame_id）；未定位时位姿为里程计坐标系，
//    frame_id 字段如实给出。
// 8. 本文件之外保留不变的接口：导航栈用的 LCM RPC `GeometryRuntimeService/get_navigation_map_block`；
//    三维累积点云共享内存 ${NUWAX_CLOUDMAP_SHM_PATH}（网页直接读取，见待决问题 Q6）。
//
// 已删除（相对 v2，目标架构 6.4）：Start、Stop、HealthCheck、Get*Readiness、GetMappingState、
// StopMapping（并入 StopSession）、ActivateMap、ExportMappingBackendCheckpoint、TransferGraphArtifact、
// GetAssignedLocalizationSample、GetOccupancyGridShm、GetRawOccupancyGridData（并入 GetOccupancyGrid）、
// SubscribeCloudMapUpdates、GetFrontiers、SubscribeFrontiers、SetCmdVelSinkReady、
// GetMappingCloudAuthority、SubmitMappingCloudGoal、SubscribeNavigationState 与 GetExplorationState
// （并入 SubscribeState）、GetExplorationDiagnostics、ReportNativeInputFailure（见待决问题 Q3）。
// ============================================================================

service GeometryRuntime {
  // ---------------- 控制 ----------------

  // 开始建图会话。
  // continue_saved=false：新建空图 map_name；目录下已有 geometry/ → ALREADY_EXISTS。
  // continue_saved=true：在已保存地图 map_name 上续建；要求当前为“已定位”且已加载的就是 map_name，
  //   否则 FAILED_PRECONDITION；地图不存在 → NOT_FOUND。
  // 二维故障保存的地图若标明无完整 SLAM 图 → FAILED_PRECONDITION（原因写明不能用于二维续建）。
  // 当前已在建同名地图（建图中/探索中，map_name 相同）→ 不做任何事，直接返回当前状态。
  // 其它任何状态：先结束当前状态（取消导航目标、结束探索、丢弃未保存的建图），再开始。
  // 成功后阶段 = 建图中。
  rpc StartMapping(StartMappingRequest) returns (GeometryState);

  // 结束当前会话回到“空闲”：取消导航目标与探索，丢弃未保存的建图，卸载已加载地图。
  // 任何状态都允许；已是空闲时不做任何事。替代 v2 的 StopMapping 与“清除当前地图”。
  rpc StopSession(Empty) returns (GeometryState);

  // 把当前建图会话保存为地图目录 <地图根>/<map_name>/geometry/（原子替换）。
  // 允许状态：建图中、探索中、故障态且仍持有地图；保存前后阶段不变。
  // 建图中/探索中实时帧继续进入建图；故障态保存已持有的数据。
  // 二维故障态只保存当前栅格与点云，在 geometry/ 内标明无完整 SLAM 图、不能用于二维续建。
  // map_name 为空表示用当前会话的地图名。
  // map_name 已存在：若它是本会话的来源（续建时加载的图，或本会话已成功保存过的名字）→ 原子覆盖；
  //   否则 → ALREADY_EXISTS。
  // 保存成功后，本会话的地图名与来源都变为 map_name（另存为即改名），之后不带名字的 SaveMap 覆盖它。
  // 其它状态 → FAILED_PRECONDITION（“当前没有正在建的地图”）。
  rpc SaveMap(SaveMapRequest) returns (SaveMapResponse);

  // 加载已保存地图作为定位基准，阶段 = 已加载未定位；之后调用 Relocalize。
  // 任何状态都允许，先结束当前状态。地图不存在 → NOT_FOUND；文件损坏 → DATA_LOSS（原因写明文件）。
  rpc LoadMap(LoadMapRequest) returns (GeometryState);

  // 在已加载地图上重定位，阻塞到得出结果（用最近帧匹配，最多 8 帧或 2 秒）。
  // 允许状态：已加载未定位、已定位；其它 → FAILED_PRECONDITION。
  // Geometry 配置为回环校正（library_pgo/native_pgo）时 → FAILED_PRECONDITION（原因写明）。
  // 匹配失败不是 RPC 错误：返回 succeeded=false，阶段保持/回到“已加载未定位”，原因写进状态。
  // 匹配成功：校正 map→odom，阶段 = 已定位。结果同时写进 GeometryState.relocalization。
  rpc Relocalize(RelocalizeRequest) returns (RelocalizationResult);

  // 下发导航目标，Geometry 持有为唯一当前目标；旧目标状态变为“被替换”；探索中则结束探索（回到建图中）。
  // 允许状态：建图中、探索中、已定位；其它 → FAILED_PRECONDITION（“未定位”）。
  // 导航栈输入未就绪或禁行区未刷新时目标进入“等待输入”，不拒绝，调用方不重提。
  rpc SetGoal(NavigationGoal) returns (SetGoalResponse);

  // 取消导航目标。goal_id 为空表示当前目标。目标不是当前目标或已结束时不做任何事，返回成功。
  // 任何状态都允许。被取消的目标状态 = 已取消。
  rpc CancelGoal(CancelGoalRequest) returns (Empty);

  // 开始探索，返回 exploration_id。允许状态：建图中；探索中时新探索替换旧探索（旧探索 = 已停止）。
  // 其它状态 → FAILED_PRECONDITION（“需要先开始建图”）。网关的探索任务先调用 StartMapping 再调用本接口。
  rpc StartExploration(ExplorationRequest) returns (StartExplorationResponse);

  // 停止探索，阶段回到建图中。exploration_id 为空表示当前探索。
  // 没有进行中的探索或 id 不是当前探索时不做任何事，返回成功。任何状态都允许。
  rpc StopExploration(StopExplorationRequest) returns (Empty);

  // 导出本会话最近一次探索的进度（用于暂停后恢复：StartExploration.resume_progress_json）。
  // 允许状态：建图中、探索中，且本会话内开始过探索；否则 FAILED_PRECONDITION。会话结束后进度清空。
  rpc GetExplorationProgress(ExplorationProgressRequest) returns (ExplorationProgress);

  // ---------------- 读取 ----------------

  // 读取完整状态快照。任何状态都允许。
  rpc GetState(Empty) returns (GeometryState);

  // 状态流：首条为当前完整快照；之后状态变化（阶段、原因、地图名、导航、探索、重定位结果）时推送最新完整快照，
  // 订阅者慢时只拿到最新值（中间值可能被跳过）。位姿变化本身不触发推送（位姿用 SubscribePose）。
  // 等待某个目标的调用方按 GeometryState.navigation 与 previous_navigation 判断结果。
  rpc SubscribeState(Empty) returns (stream GeometryState);

  // 位姿流：只推最新位姿，订阅者慢时丢弃中间值。首条为当前位姿（尚无位姿时等第一帧）。
  rpc SubscribePose(Empty) returns (stream Pose);

  // 地图流：占据栅格每次更新推一条，只推最新，订阅者慢时丢弃中间值。
  // 首条为当前栅格（尚无栅格时等第一次更新）。会话切换后推送新会话的第一张栅格。
  rpc SubscribeMap(Empty) returns (stream MapUpdate);

  // 读取当前占据栅格。include_forbidden=true 叠加禁行区（导航用的有效栅格），false 为物理栅格。
  // 没有栅格（空闲或尚未建出）→ FAILED_PRECONDITION。
  rpc GetOccupancyGrid(GetOccupancyGridRequest) returns (OccupancyGrid);

  // 分块读取当前会话（建图中为实时，已加载为该地图）的完整稠密扫描点，网页三维显示用。
  // 没有点云 → FAILED_PRECONDITION。
  rpc GetDenseCloudChunk(DenseCloudChunkRequest) returns (DenseCloudChunk);

  // 读取坐标树最新边（map→odom、odom→base、base→传感器）。任何状态都允许。
  rpc GetFrameTree(Empty) returns (FrameTree);

  // ---------------- 输入（保持 v2 语义） ----------------
  // 输入桥在 Geometry 首次就绪后启动一次，之后一直发送。
  // 三维：点云与 IMU 始终交给 LIO（任何会话阶段都运行，输出位姿）；配准后的点云在建图中/探索中进入当前
  //   会话的建图对象，在已加载/已定位时供重定位取最近帧，空闲时不再往下交。
  // 二维：只有建图中/探索中/已加载/已定位时交给二维工作进程，空闲时丢弃。
  // 丢弃不是错误，返回 success=true。消息格式不合法 → INVALID_ARGUMENT。

  // 雷达点云（可附带 IMU 样本）。三维执行链用。
  rpc PublishPointCloud(PublishPointCloudRequest) returns (PublishResult);
  // 设备里程计。二维执行链用。
  rpc PublishOdom(PublishOdomRequest) returns (PublishResult);
  // 二维激光扫描。二维执行链用。
  rpc PublishLaserScan(PublishLaserScanRequest) returns (PublishResult);
}

// ============================================================================
// 通用几何消息（照抄 v2）
// ============================================================================

message Empty {}

message Vec3 { double x = 1; double y = 2; double z = 3; }
message Quat { double x = 1; double y = 2; double z = 3; double w = 4; }

message Pose {
  Vec3 position = 1;
  Quat orientation = 2;
  string frame_id = 3;
  uint64 timestamp_ns = 4;   // 产生该位姿的传感器源时间（Unix 纳秒）
}

message Transform {
  string parent_frame = 1;
  string child_frame = 2;
  Vec3 translation = 3;
  Quat rotation = 4;
  uint64 timestamp_ns = 5;
}

message FrameTree { repeated Transform transforms = 1; }

// ============================================================================
// 状态
// ============================================================================

// 会话阶段（目标架构 6.2 状态机）。
enum SessionPhase {
  SESSION_PHASE_UNSPECIFIED = 0;
  SESSION_PHASE_IDLE = 1;        // 空闲：没有建图、没有加载地图
  SESSION_PHASE_MAPPING = 2;     // 建图中：可导航、可保存
  SESSION_PHASE_EXPLORING = 3;   // 探索中：建图中的一种
  SESSION_PHASE_LOADED = 4;      // 已加载未定位：等待或刚失败重定位，原因在 reason
  SESSION_PHASE_LOCALIZED = 5;   // 已定位：可导航；可同名续建
  SESSION_PHASE_FAULT = 6;       // 故障：子系统出错，原因在 reason；StartMapping / LoadMap 重建子系统后恢复
}

message GeometryState {
  SessionPhase phase = 1;
  // 原因文本：故障原因、最近一次重定位失败原因；正常时为空。
  string reason = 2;
  // 建图中/探索中：正在建的地图名；已加载/已定位：加载的地图名；空闲、故障为空。
  string map_name = 3;
  // 最新机体位姿：LIO（或二维工作进程）有输出即给，尚无输出时不设置。建图中/探索中/已定位为地图坐标，
  // 其余阶段为里程计坐标（见 frame_id）。状态流里的位姿只是推送时刻的值，实时位姿用 SubscribePose。
  Pose pose = 4;
  // 当前（或最近一个）导航目标；从未下发过目标时不设置。终态保留到下一个目标。
  NavigationStatus navigation = 5;
  // 当前（或本会话最近一次）探索；本会话未探索过时不设置。终态保留到会话结束或下一次探索。
  ExplorationStatus exploration = 6;
  // 本会话最近一次重定位结果；未重定位过时不设置。
  RelocalizationResult relocalization = 7;
  // 进程启动时确定、运行期间不变的信息。
  RuntimeInfo info = 8;
  // 上一个已结束的导航目标（成功、失败、已取消、被替换、已被停止之一），新目标替换旧目标时由旧目标填入。
  // 等待目标的规则：自己的 goal_id 是 navigation.goal_id → 看它的状态；是 previous_navigation.goal_id → 用它的终态；
  // 两者都不是 → 视为被替换（已被更新的命令取代）。
  NavigationStatus previous_navigation = 9;
}

// 静态信息。替代 v2 HealthCheck 中输入桥与显示需要的字段（见待决问题 Q2）。
message RuntimeInfo {
  string pipeline = 1;                    // "lio_3d" 或 "slam_2d"
  string map_frame_id = 2;
  string odom_frame_id = 3;
  string base_frame_id = 4;
  // 二维执行链：激光输入模板（JSON，v2 HealthCheck.planar_input_config）与单调时钟到 Unix 时间的偏移；
  // 二维输入桥构造设备源与换算时间戳用。三维执行链为空/0。
  string planar_input_config_json = 5;
  int64 planar_unix_offset_ns = 6;
}

// ============================================================================
// 导航目标（目标架构 6.5）
// ============================================================================

enum GoalStatus {
  GOAL_STATUS_UNSPECIFIED = 0;
  GOAL_STATUS_WAITING_INPUT = 1;  // 等待输入：导航栈输入未就绪或禁行区未刷新，就绪后自动继续
  GOAL_STATUS_PLANNING = 2;       // 规划中（含暂无可行路径、导航栈继续重试的情况，见 no_feasible_path）
  GOAL_STATUS_EXECUTING = 3;      // 执行中
  GOAL_STATUS_SUCCEEDED = 4;      // 成功：已到达
  GOAL_STATUS_FAILED = 5;         // 失败：原因在 message
  GOAL_STATUS_CANCELLED = 6;      // 已取消：CancelGoal 或会话切换
  GOAL_STATUS_REPLACED = 7;       // 被替换：新的 SetGoal 到达
  GOAL_STATUS_STOPPED = 8;        // 已被停止：导航栈申请租约被拒或租约被收回（急停或更新的运动命令）
}

message NavigationGoal {
  // 目标位姿，地图坐标系；frame_id 为空视为地图坐标系，其它坐标系 → INVALID_ARGUMENT。
  // 三维地图未给高度时由网关用当前位姿高度填入（Geometry 不猜）。
  Pose pose = 1;
  // 受理该运动命令时守卫 Begin 返回的运动代次。Geometry 原样交给导航栈，导航栈用它 Acquire 租约。
  uint64 motion_generation = 2;
  // 不设置时按导航配置的默认值。
  optional bool allow_reverse = 3;
  optional double position_tolerance_m = 4;
  optional double yaw_tolerance_rad = 5;
}

message SetGoalResponse {
  string goal_id = 1;   // Geometry 生成；调用方用它在状态里找到自己的目标、取消目标
}

message CancelGoalRequest {
  string goal_id = 1;   // 空 = 当前目标
}

message NavigationStatus {
  string goal_id = 1;
  GoalStatus status = 2;
  string message = 3;                 // 当前情况或终态原因
  double remaining_distance_m = 4;    // 沿规划路径的剩余距离；未知为 0
  Pose target = 5;                    // 目标位姿（显示用）
  // 规划中且当前找不到到达目标的完整可行路径（导航栈继续重试）。
  // 网关的区域目标任务据此判断“已在区域内即结束”（总体架构图 flow_nav N7）。
  bool no_feasible_path = 6;
  repeated Vec3 planned_path = 7;     // 当前规划路径（地图坐标）；终态为空
  // 本目标由探索派发（不是 SetGoal）。导航任务只看自己的 goal_id，网页据此区分显示。
  bool exploration_child = 8;
}

// ============================================================================
// 探索
// ============================================================================

message ExplorationBoundarySegment {
  double start_x = 1;
  double start_y = 2;
  double end_x = 3;
  double end_y = 4;
}

message ExplorationStopConditions {
  optional double max_coverage_pct = 1;
  optional uint64 no_frontier_timeout_ms = 2;
  optional uint64 max_duration_ms = 3;
  optional uint32 max_goals = 4;
}

// 总行程是路径预算，不换算为电池能耗；不设置表示不返航。
message ExplorationReturnPolicy {
  optional double maximum_distance_m = 1;
  double reserve_distance_m = 2;
  bool return_on_completion = 3;
}

message ExplorationRequest {
  // 受理该运动命令时守卫 Begin 返回的运动代次；子导航目标都用它申请租约。
  uint64 motion_generation = 1;
  // 有序、首尾相接的闭合多边形边（地图坐标）；为空表示不限范围。拓扑不合法 → INVALID_ARGUMENT。
  repeated ExplorationBoundarySegment boundary = 2;
  ExplorationStopConditions stop_conditions = 3;
  uint32 max_navigation_retries = 4;
  double blacklist_radius_m = 5;
  ExplorationReturnPolicy return_policy = 6;
  // GetExplorationProgress 导出的进度，用于恢复；空表示新任务。地图名与当前会话不符 → FAILED_PRECONDITION。
  string resume_progress_json = 7;
}

message StartExplorationResponse {
  string exploration_id = 1;   // Geometry 生成
}

message StopExplorationRequest {
  string exploration_id = 1;   // 空 = 当前探索
}

message ExplorationProgressRequest {
  string exploration_id = 1;   // 空 = 本会话最近一次探索
}

message ExplorationProgress {
  string exploration_id = 1;
  string progress_json = 2;    // 原样交回 StartExploration.resume_progress_json
}

enum ExplorationPhase {
  EXPLORATION_PHASE_UNSPECIFIED = 0;
  EXPLORATION_PHASE_RUNNING = 1;     // 进行中（含返航）
  EXPLORATION_PHASE_SUCCEEDED = 2;   // 完成：满足停止条件或没有可达前沿
  EXPLORATION_PHASE_FAILED = 3;      // 失败：原因在 message
  EXPLORATION_PHASE_STOPPED = 4;     // 已停止：StopExploration、新导航目标、新探索、会话切换、子目标被急停
}

message ExplorationStatus {
  string exploration_id = 1;
  ExplorationPhase phase = 2;
  string message = 3;               // 当前在做什么，或结束原因
  uint32 frontier_count = 4;        // 剩余前沿数
  uint32 goals_completed = 5;       // 已到达的子目标数
  bool returning = 6;               // 正在返航（启用返航策略时）
  double traveled_distance_m = 7;   // 已行驶路程（启用行程预算时）
}

// ============================================================================
// 地图
// ============================================================================

message StartMappingRequest {
  string map_name = 1;
  bool continue_saved = 2;
}

message SaveMapRequest {
  string map_name = 1;   // 空 = 当前会话地图名
}

message SaveMapResponse {
  string map_name = 1;   // 实际保存的地图名
  bool replaced = 2;     // true：覆盖了已有目录（本会话的来源）；false：新建目录
}

message LoadMapRequest {
  string map_name = 1;
}

// 二维初值：地图坐标 x、y、朝向。
message PlanarSeed { double x = 1; double y = 2; double yaw = 3; }

message RelocalizeRequest {
  // 可选初值。二维执行链按初值局部匹配，不给则用地图保存时的位姿；
  // 三维执行链不接受初值（给了 → INVALID_ARGUMENT），做全局匹配。
  PlanarSeed seed = 1;
}

message RelocalizationResult {
  bool succeeded = 1;
  string message = 2;            // 失败原因或成功摘要
  Pose pose = 3;                 // 成功时：校正后的机体位姿（地图坐标）
  double fitness = 4;            // 匹配得分（算法原值，越小越好）；失败且未算出时为 0
  uint32 frames_used = 5;        // 参与匹配的帧数
  uint64 finished_at_ns = 6;     // 结束时间（Unix 纳秒）
}

message OccupancyGridMeta {
  uint32 width = 1;
  uint32 height = 2;
  float resolution = 3;          // 米/格
  double origin_x = 4;           // 栅格 (0,0) 角点在地图坐标中的位置
  double origin_y = 5;
  string frame_id = 6;
  uint64 timestamp_ns = 7;       // 本栅格最后一次更新的源时间
}

// 每格一个 int8：-1 未知，0 空闲，1–100 占据概率（照抄 v2）。按行优先，行数 = height。
message OccupancyGrid {
  string map_name = 1;
  OccupancyGridMeta meta = 2;
  bytes data = 3;
}

message GetOccupancyGridRequest {
  bool include_forbidden = 1;
}

message MapUpdate {
  string map_name = 1;
  OccupancyGridMeta meta = 2;
  bytes data = 3;        // 叠加禁行区的有效栅格（导航、记忆规划用）
  bytes raw_data = 4;    // 物理栅格（网页显示后另画禁行区用）；两者布局相同
}

// 全部有效扫描点按原坐标分块读取。
message DenseCloudChunkRequest {
  string expected_epoch = 1;   // 上次读到的 epoch；空表示从头读
  uint64 offset_points = 2;
  uint32 max_points = 3;
  bool allow_delta = 4;        // 允许返回相对已读前缀的增量
}

message DenseCloudChunk {
  // 点云内容来源标识：会话切换、加载地图、点云整体重建时改变。网页据此判断能否从 offset 续读
  // （这是本接口唯一的“身份”字段，调用方为网页稠密点云流）。
  string epoch = 1;
  uint64 source_timestamp_ns = 2;
  string frame_id = 3;
  uint64 total_points = 4;
  uint64 offset_points = 5;
  bytes xyz_f32_le = 6;
  repeated float bounds_min = 7;
  repeated float bounds_max = 8;
  // 增量：基于 base_epoch 已安装前缀；removed_ranges 为旧前缀中的（起点, 长度）对。
  string base_epoch = 9;
  uint64 base_offset_points = 10;
  repeated uint64 removed_ranges = 11;
}

// ============================================================================
// 输入（照抄 v2；删去会话号/运行代际字段，见待决问题 Q1）
// ============================================================================

message PublishOdomRequest {
  Pose pose = 1;
  string clock_domain = 2;   // "unix_ns" 或 "monotonic_ns"
  string clock_id = 3;
}

message PublishLaserScanRequest {
  bytes payload = 1;         // services/geometry/planar_wire.py 编码的规范二维扫描
}

message PointCloudField {
  string name = 1;
  uint32 offset = 2;
  uint32 datatype = 3;      // sensor_msgs/PointField 数值类型
  uint32 count = 4;
}

message LioImuSample {
  uint64 timestamp_ns = 1;
  string frame_id = 2;
  double accel_mps2_x = 3;
  double accel_mps2_y = 4;
  double accel_mps2_z = 5;
  double gyro_rps_x = 6;
  double gyro_rps_y = 7;
  double gyro_rps_z = 8;
  // 姿态不是所有 IMU 源都提供；false 时按未知处理。
  bool orientation_valid = 9;
  double orientation_x = 10;
  double orientation_y = 11;
  double orientation_z = 12;
  double orientation_w = 13;
}

message PublishPointCloudRequest {
  bytes points = 1;          // 规范 PointCloud2 数据字节
  uint32 point_step = 2;
  string frame_id = 3;
  uint64 timestamp_ns = 4;
  repeated PointCloudField fields = 5;
  uint32 point_count = 6;
  bool is_dense = 7;
  repeated LioImuSample imu_samples = 8;
  // 辅助观测：用已估计位姿更新同一地图，不进入激光惯性前端。
  bool mapping_only = 9;
  repeated double sensor_origin_xyz = 10;
  string sensor_id = 11;
  uint64 source_sequence = 12;
  string clock_id = 13;
  string calibration_ref = 14;
}

message PublishResult {
  bool success = 1;
  string message = 2;
}
