[package]
name = "nuwax-geometry-runtime"
version = "0.1.0"
edition = "2021"
description = "nuwax 平台几何 LCM/nuwax native runtime 子进程（独立于 Python 网关）"

# 依赖来源：nuwax-workspace LCM-first Rust 栈
# 路径：本仓 repo-local `services/nuwax-workspace`（Phase 1,2026-07-07 已并入）
# MSRV 1.88；目标机 aarch64 + Ubuntu 20.04；不允许引入 ROS2/r2r/DDS/RMW 依赖。

[dependencies]
# nuwax-workspace path deps（LCM-first）。
#
# Phase 5 (2026-07-07) 修订 — codex rework lane-11 (fake-only 构建路径真接通):
# - `nuwax-transport/real-lcm` 已实装(本仓 `services/nuwax-workspace/crates/nuwax-lcm*`)
# - **Runtime binary 生产默认启 real-lcm** —— 由下方 `default = ["real-lcm-bridge"]`
#   走 `real-lcm-bridge = ["nuwax-transport/real-lcm"]` 显式拉入,
#   使 lcm_runtime.rs `Real` 分支(`cfg(feature = "real-lcm-bridge")`)
#   真起 liblcm / `LcmTransport::new_real(url)`。
# - **去掉 dependency 行上的 `features = ["real-lcm"]`** —— 那是无条件 union,
#   cargo 不允许下游 feature 关闭,导致 fake-lcm-test 路径仍强制链 liblcm;
#   改为 `default-features = false`(nuwax-transport 无 default feature),
#   把"启不启 real-lcm"的决定权完全交给本 binary 自己的 feature 块。
# - CI 镜像编译 fake-only 二进制(无 liblcm-dev)用
#   `cargo build --no-default-features --features fake-lcm-test`;
#   走 fake-lcm-test 时 `real-lcm-bridge` **不被 default 拉入**,
#   `nuwax-transport/real-lcm` 因此也**不被拉入** → fake-only 二进制成立。
#
# 上游 dimos 路径仍保留 Phase 1 baseline — Phase 8/9 再替换为本仓相对路径。
nuwax-protocol = { path = "../../nuwax-workspace/crates/nuwax-protocol" }
# 见上方 Phase 5 注释 ——
# 之前 `features = ["real-lcm"]` 把 upstream feature 钉死,
# 现改 `default-features = false`,由下方 `[features]` 块决定是否启用。
nuwax-transport = { path = "../../nuwax-workspace/crates/nuwax-transport", default-features = false }
nuwax-codec = { path = "../../nuwax-workspace/crates/nuwax-codec" }
nuwax-tf = { path = "../../nuwax-workspace/crates/nuwax-tf" }

# Phase 4:real-lcm bridge feature gate —— runtime binary 默认启用
# (Phase 5 rework lane-11 后,upstream `nuwax-transport/real-lcm` 由本 binary
# 的 `default = ["real-lcm-bridge"]` + `real-lcm-bridge = ["nuwax-transport/real-lcm"]`
# 二次断言链路拉入,而非 dependency 行无条件 union),
# 下方 `real-lcm-bridge` 是 nuwax_geometry_runtime 本地的二次断言开关,
# 仅用于显式 `--features real-lcm-bridge` 触发代码内 cfg 编译期门;
# 未开 feature 时 `lcm_runtime.rs` Real 分支仍走 fail-fast
# 路径(`RealLcmBackendUnavailable` / 进程硬退出)。这样 CI/dev 机编译
# fake-only 二进制仍可通过(走 `--no-default-features --features fake-lcm-test`),
# 生产/集成镜像(installer 装 liblcm-dev 后)默认 `--release` 启停脚本已
# 隐式启用 real-lcm。

# Phase 2:建图 / 导航 / 探索功能 crate 接入。
# feature 名以 dimos 实际 Cargo.toml 为准(见 Phase 2 执行方案 / feedback_phase2.md)。
# - nuwax-nav-stack:foundation + simple-2d + replanning-astar(P1 再开 native-*/explore)
# - nuwax-exploration:wavefront + runtime(P1 再开 tare,terrain-map-ext,spec-summary)
nuwax-mapping = { path = "../../nuwax-workspace/crates/nuwax-mapping" }
nuwax-nav-stack = { path = "../../nuwax-workspace/crates/nuwax-nav-stack", default-features = false, features = ["foundation", "simple-2d", "replanning-astar"] }
nuwax-nav-types-messages = { path = "../../nuwax-workspace/crates/nuwax-nav-types-messages" }
nuwax-nav-simple-planner = { path = "../../nuwax-workspace/crates/nuwax-nav-simple-planner" }
nuwax-nav-astar = { path = "../../nuwax-workspace/crates/nuwax-nav-astar" }
nuwax-nav-terrain-map-ext = { path = "../../nuwax-workspace/crates/nuwax-nav-terrain-map-ext" }
# Phase 4 nav_runtime:基本路径跟随器(simple-2d / astar profile 的 cmd_vel 生成)
nuwax-nav-basic-path-follower = { path = "../../nuwax-workspace/crates/nuwax-nav-basic-path-follower" }
# Phase 4 nav_runtime:serde 用于 NavigationReadinessDetail JSON 序列化
uuid = { version = "1", features = ["v4"] }
nuwax-exploration = { path = "../../nuwax-workspace/crates/nuwax-exploration", default-features = false, features = ["wavefront", "runtime"] }
nuwax-explore-wavefront = { path = "../../nuwax-workspace/crates/nuwax-explore-wavefront" }

# 原生 runtime 必备依赖（gRPC/HTTP/SHM/日志/系统调用）
tokio = { version = "1", features = ["full", "net"] }
tokio-stream = "0.1"
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
nix = { version = "0.29", features = ["fs", "mman"] }
futures = "0.3"
parking_lot = "0.12"

# Phase 3 mapping_adapter 需要 nalgebra 复用 nuwax-mapping 的 Point3/Isometry3
# 类型(workspace 已经使用 0.33 + serde-serialize)。固定到同一版本以避免
# `nuwax-mapping::OccupancyGrid.origin` (nalgebra::Isometry3) 跨 crate 类型错配。
nalgebra = { version = "0.33", features = ["serde-serialize"] }

# Phase 4 `[features]`(2026-07-07 codex rework lane-2):
#   - `real-lcm-bridge`: runtime binary 的二次断言开关,
#     当显式传 `--features real-lcm-bridge` 时,
#     `lcm_runtime.rs` 的 `cfg(feature = "real-lcm-bridge")` 编译期门允许
#     `LcmTransport::new_real(url)` 真起 liblcm。
#     生产 profile 走隐式启用(nuwax-transport 的 `features = ["real-lcm"]`
#     已经在 [dependencies] 显式拉入),但代码内 cfg 需要此 feature 才能开门,
#     所以 real-lcm-bridge **默认应启用**(作为 default feature)以保证 runtime
#     binary 默认走 real-lcm。
#   - `fake-lcm-test`: CI / dev 机无 liblcm-dev 时用,会通过
#     `nuwax-transport` 的 `default-features = false` 关闭 real-lcm,
#     同时关闭本 binary 的 `real-lcm-bridge` 默认门,
#     强制编译期 fake-only 二进制。
#
# Phase 5 (2026-07-07 codex rework lane-11) 修订:
#   - dependency 行不再钉死 `features = ["real-lcm"]`(见上方注释);
#   - `real-lcm-bridge` 现在是**唯一**拉入 upstream `nuwax-transport/real-lcm`
#     的入口 —— `fake-lcm-test` 显式**不**拉,实现 fake-only 路径。
#   - `default = ["real-lcm-bridge"]` 保持不变 —— 生产/集成镜像(installer 装
#     liblcm-dev 后)默认 `--release` 启停脚本仍隐式启用 real-lcm。
#
# 该块必须位于所有 `[dependencies]` 之后 —— cargo 解析遇到 `[features]`
# 会把后续行当作 features 序列,不是依赖 map。
[features]
default = ["real-lcm-bridge"]
real-lcm-bridge = ["nuwax-transport/real-lcm"]
# CI / dev 镜像专用:与 real-lcm-bridge 互斥,
# 同时通过 `--no-default-features` 把本 binary 的 default(real-lcm-bridge)关掉,
# `nuwax-transport/real-lcm` 因此也**不被拉入** —— 真 fake-only 二进制成立。
# `cargo build --no-default-features --features fake-lcm-test`。
#
# body 显式为空(`= []` 而不是省略)以表明意图:fake-lcm-test 是 fake-only
# 编译期标识符,无需拉入额外 upstream feature,因为 upstream 已被 default
# 路径未启用时自然进入 fake-only 分支(`LcmTransport::Fake` 始终可用,
# 不依赖任何 cargo feature)。
fake-lcm-test = []

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "nuwax-geometry-runtime"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true