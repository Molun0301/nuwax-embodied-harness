[package]
name = "nuwax-navigation-simulator"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
serde_json = "1"
libc = "0.2"
nuwax-nav-stack = { path = "../../../services/nuwax-workspace/crates/nuwax-nav-stack", features = ["mls"] }
nuwax-nav-runtime = { path = "../../../services/nuwax-workspace/crates/nuwax-nav-runtime" }
nuwax-nav-mls-planner = { path = "../../../services/nuwax-workspace/crates/nuwax-nav-mls-planner" }
nuwax-nav-types-messages = { path = "../../../services/nuwax-workspace/crates/nuwax-nav-types-messages" }
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
