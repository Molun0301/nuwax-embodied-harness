# nuwax motion service identities. UID/GID allocation is intentionally dynamic.
g nuwax-motion-clients - -

u nuwax-motion-guard - "NuwaX motion safety guard" /var/lib/nuwax/motion-guard /usr/sbin/nologin
u nuwax-navigation - "NuwaX navigation runtime" /nonexistent /usr/sbin/nologin
u nuwax-geometry - "NuwaX geometry runtime" /nonexistent /usr/sbin/nologin
u nuwax-gateway - "NuwaX host gateway" /nonexistent /usr/sbin/nologin

# The group only grants transport access. The guard still authorizes SO_PEERCRED
# peer UID and request source independently.
m nuwax-motion-guard nuwax-motion-clients
m nuwax-navigation nuwax-motion-clients
m nuwax-geometry nuwax-motion-clients
m nuwax-gateway nuwax-motion-clients
