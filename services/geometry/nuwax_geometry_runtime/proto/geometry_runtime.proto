syntax = "proto3";
package nuwax.geometry;

// ============================================================================
// 目标态 GeometryRuntime gRPC facade
// - 内部数据协议走 nuwax-workspace LCM typed channels（fake backend 默认）；
// - 该 proto 仅作为 Python 网关 ↔ Rust runtime 之间的 gRPC 控制面兼容边界；
// - 旧 ROS2 / r2r / Nav2 action / CycloneDDS 依赖已删除；不允许恢复。
// ============================================================================

message Empty {}
message Vec3 { double x = 1; double y = 2; double z = 3; }
message Quat { double x = 1; double y = 2; double z = 3; double w = 4; }
message Pose {
  Vec3 position = 1;
  Quat orientation = 2;
  string frame_id = 3;
  uint64 timestamp_ns = 4;
}
message Transform {
  string parent_frame = 1;
  string child_frame = 2;
  Vec3 translation = 3;
  Quat rotation = 4;
  uint64 timestamp_ns = 5;
}
message FrameTree { repeated Transform transforms = 1; }
message ShmRef {
  string key = 1;
  uint64 size = 2;
  uint64 revision = 3;
  uint32 layout_version = 4;
  uint32 payload_schema_version = 5;
  uint64 generation = 6;
  uint32 active_slot = 7;
  uint64 payload_size = 8;
}

// === 控制面 ===
message StartRequest { string config_json = 1; }
message StartResult { bool success = 1; string message = 2; }
message StopRequest {}
message StopResult { bool success = 1; }
message RuntimeStatus {
  string phase = 1;
  string message = 2;
  uint64 uptime_ms = 3;
  uint32 rss_kb = 4;
  string lcm_backend = 5;
}

// === 定位 ===
message PoseRequest { string target_frame = 1; string source_frame = 2; }
message PoseUpdate { Pose pose = 1; uint64 sequence = 2; }

// === 地图 ===
message OccupancyGridMeta {
  uint32 width = 1;
  uint32 height = 2;
  float resolution = 3;
  double origin_x = 4;
  double origin_y = 5;
  string frame_id = 6;
  uint64 revision = 7;
  uint64 timestamp_ns = 8;
}
message MapUpdateNotification {
  OccupancyGridMeta meta = 1;
  ShmRef shm_ref = 2;
  bytes data = 3;
  uint64 size = 4;
  uint32 schema_version = 5;
  string checksum = 6;
  int64 last_seen_ms = 7;
  string session_id = 8;
  string map_version_id = 9;
  uint64 session_generation = 10;
}
message OccupancyGridData {
  OccupancyGridMeta meta = 1;
  bytes data = 2;
}

message StartMappingRequest {
  string session_id = 1;
  string map_name = 2;
  string map_version_id = 3;
}

message StopMappingRequest {
  string session_id = 1;
  string reason = 2;
}

message MappingSessionState {
  bool success = 1;
  string phase = 2;
  string message = 3;
  string session_id = 4;
  string map_name = 5;
  string map_version_id = 6;
  uint64 session_generation = 7;
  uint64 revision = 8;
  bool active = 9;
  bool idempotent_replay = 10;
}

// === 视频帧共享内存 ===
message VideoFrameShmRef {
  string shm_path = 1;
  string uds_path = 2;
  uint64 sequence = 3;
  uint32 frame_size = 4;
  uint64 timestamp_ns = 5;
}

// === 健康检查 ===
message HealthCheckRequest {}
message HealthCheckResponse {
  bool healthy = 1;
  string phase = 2;
  uint64 uptime_ms = 3;
  uint32 rss_kb = 4;
  uint64 video_frame_sequence = 5;
  uint32 video_fps_estimate = 6;
  string lcm_backend = 7;
}

// === 累积地图共享内存引用 ===
message CloudMapShmRef {
  ShmRef shm_ref = 1;
  uint32 point_count = 2;
  float voxel_size = 3;
}

// === 导航兼容 ===
enum NavigationOwnerKind {
  NAVIGATION_OWNER_KIND_UNSPECIFIED = 0;
  NAVIGATION_OWNER_KIND_PUBLIC_NAV = 1;
  NAVIGATION_OWNER_KIND_EXPLORATION_CHILD = 2;
}

message NavigationGoal {
  Pose pose = 1;
  string frame_id = 2;
  string goal_id = 3;
  uint64 map_revision = 4;
  string map_version_id = 5;
  string parent_request_id = 6;
  uint64 goal_generation = 7;
  NavigationOwnerKind owner_kind = 8;
}
message CancelNavigationRequest {
  string goal_id = 1;
  NavigationOwnerKind owner_kind = 2;
  string parent_request_id = 3;
  uint64 goal_generation = 4;
  uint64 producer_runtime_generation = 5;
}
message NavigationState {
  string status = 1;
  string message = 2;
  string goal_id = 3;
  float distance_remaining = 4;
  uint64 timestamp_ns = 5;
  string cancel_phase = 6;
  uint64 cancel_generation = 7;
  bool actuator_zeroed = 8;
  string reason_code = 9;
  uint64 runtime_generation = 10;
  uint64 guard_generation = 11;
  bool sink_ready = 12;
  uint64 planner_map_revision = 13;
  string planner_map_frame = 14;
  string planner_pose_frame = 15;
  string zero_ack_id = 16;
  uint64 zero_applied_monotonic_ns = 17;
  NavigationOwnerKind owner_kind = 18;
  string parent_request_id = 19;
  uint64 goal_generation = 20;
  uint64 path_revision = 21;
  bytes goal_payload_sha256 = 22;
  bytes path_payload_sha256 = 23;
  string map_version_id = 24;
  uint64 producer_runtime_generation = 25;
}
message NavigationReadiness {
  bool ready = 1;
  string reason = 2;
  string reason_code = 3;
  repeated string blockers = 4;
  uint64 tf_generation = 5;
  uint64 planner_generation = 6;
  uint64 motion_sink_generation = 7;
  string map_frame = 8;
  string pose_frame = 9;
}

// Phase 7: 三套 readiness 字段打包 message(JSON 字符串给 Python 解析)。
// 与 `NavigationReadiness.reason` 同模式:把综合判定 + 各子项字段 JSON 化
// 塞进 message,Python 端用 dict 解码对应字段。
message MappingReadiness {
  bool ready = 1;
  string message = 2;  // JSON: {lcm_backend, adapter_present, odom_count,
                       //      pointcloud_count, last_occupancy_revision,
                       //      accumulated_point_count, last_error}
}
message ExplorationReadiness {
  bool ready = 1;
  string message = 2;  // JSON: {backend_available, controller_active,
                        //      source_count, frontier_source_ready,
                        //      costmap_input_ready, costmap_input_revision,
                        //      active_source, arbitration}
}

// === legacy cmd_vel sink readiness compatibility ===
// Motion guard UDS owner 的 typed generation/ack 是 authoritative source。
// 本兼容请求的 ready=true 只有在 generation 非零且匹配当前 sink generation
// 时才可接受；不得由无 generation 的旧调用方制造 ready。
message CmdVelSinkReadyRequest {
  option deprecated = true;
  bool ready = 1;
  uint64 generation = 2;
}
message CmdVelSinkReadyResponse { bool success = 1; }

// === 探索 ===
message Frontier {
  Pose pose = 1;
  uint32 size_cells = 2;
  float heading = 3;
}
message FrontierList {
  repeated Frontier frontiers = 1;
  uint64 revision = 2;       // frontier snapshot revision
  uint64 map_revision = 3;   // costmap revision used to produce this snapshot
  string map_version_id = 4;
}

message ExplorationBoundarySegment {
  double start_x = 1;
  double start_y = 2;
  double end_x = 3;
  double end_y = 4;
}

message ExplorationStopConditions {
  optional double max_coverage_pct = 1;
  optional uint64 no_frontier_timeout_ms = 2;
  optional uint64 max_duration_ms = 3;
  optional uint32 max_goals = 4;
  bool stop_on_map_revision_change = 5;
}

// 探索启动/停止/状态/诊断 — Phase 5 additive
// 字段命名与执行方案 §3 Phase 5 + dimos `nuwax-exploration` facade 对齐。
// strategy 取值:`"wavefront"` / `"tare"` / `"highest_score"` / `"first_available"`
// （与 dimos `ExplorationArbitrationPolicy` enum 字符串名一致）。
message ExploreRequest {
  string strategy = 1;
  string arbitration = 2;
  string map_version_id = 3;
  string request_id = 4;
  uint64 map_revision = 5;
  // Ordered, continuous, closed polygon edges. The server validates topology.
  repeated ExplorationBoundarySegment boundary_line_segments = 6;
  ExplorationStopConditions stop_conditions = 7;
  uint32 max_navigation_retries = 8;
  double blacklist_radius_m = 9;
  // A request has one authoritative boundary frame; production accepts map.
  string boundary_frame_id = 10;
}
message StopExplorationRequest {
  string request_id = 1;
}
message ExplorationState {
  string status = 1;
  string message = 2;
  string request_id = 3;
  string selected_source = 4;
  string last_stop_reason = 5;
  uint32 frontier_count = 6;
  uint64 revision = 7;
  uint64 timestamp_ns = 8;
  string child_task_id = 9;
  string map_version_id = 10;
  uint64 map_revision = 11;
}
message ExplorationSourceDiag {
  string source_name = 1;
  bool is_active = 2;
  string last_goal_id = 3;
  string last_error = 4;
}
message ExplorationDiagnostics {
  bool active = 1;
  string arbitration = 2;
  string selected_source = 3;
  string last_stop_reason = 4;
  repeated ExplorationSourceDiag sources = 5;
  uint32 frontier_count = 6;
  uint64 revision = 7;
  uint64 timestamp_ns = 8;
}

// === 输入发布兼容（用于调试/自检/preview，区别于 nav2_action_provider）===
message PublishOdomRequest { Pose pose = 1; }
message PointCloudField {
  string name = 1;
  uint32 offset = 2;
  uint32 datatype = 3;      // sensor_msgs/PointField numeric datatype
  uint32 count = 4;
}
message PublishPointCloudRequest {
  bytes points = 1;          // canonical PointCloud2 data bytes（保留 field tag 兼容旧 client）
  uint32 point_step = 2;
  string frame_id = 3;
  uint64 timestamp_ns = 4;
  repeated PointCloudField fields = 5;
  uint32 point_count = 6;
  bool is_dense = 7;
}
message PublishResult { bool success = 1; string message = 2; }

// ============================================================================
// 服务定义：GeometryRuntime gRPC facade
// ============================================================================
service GeometryRuntime {
  // 控制面
  rpc Start(StartRequest) returns (StartResult);
  rpc Stop(StopRequest) returns (StopResult);
  rpc GetStatus(Empty) returns (RuntimeStatus);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // 定位
  rpc GetCurrentPose(PoseRequest) returns (Pose);
  rpc SubscribePose(PoseRequest) returns (stream PoseUpdate);
  rpc GetFrameTree(Empty) returns (FrameTree);

  // 地图
  rpc GetOccupancyGrid(Empty) returns (OccupancyGridMeta);
  rpc GetOccupancyGridData(Empty) returns (OccupancyGridData);
  rpc GetOccupancyGridShm(Empty) returns (ShmRef);
  rpc SubscribeMapUpdates(Empty) returns (stream MapUpdateNotification);
  rpc SubscribeCloudMapUpdates(Empty) returns (stream CloudMapShmRef);
  rpc StartMapping(StartMappingRequest) returns (MappingSessionState);
  rpc StopMapping(StopMappingRequest) returns (MappingSessionState);
  rpc GetMappingState(Empty) returns (MappingSessionState);

  // 导航兼容（与 nuwax-nav-stack LCM channel 接口对应）
  rpc SetNavigationGoal(NavigationGoal) returns (NavigationState);
  rpc CancelNavigation(CancelNavigationRequest) returns (NavigationState);
  rpc SubscribeNavigationState(Empty) returns (stream NavigationState);
  rpc GetNavigationReadiness(Empty) returns (NavigationReadiness);

  // Phase 7: mapping + exploration readiness(各板块独立 RPC,message JSON 解析)。
  // 详见 `mapping_adapter::MappingReadiness` / `explore_runtime::ExplorationReadinessDetail`。
  rpc GetMappingReadiness(Empty) returns (MappingReadiness);
  rpc GetExplorationReadiness(Empty) returns (ExplorationReadiness);

  // Legacy compatibility only; authoritative readiness comes from the
  // generation-fenced motion guard owner.
  rpc SetCmdVelSinkReady(CmdVelSinkReadyRequest) returns (CmdVelSinkReadyResponse) {
    option deprecated = true;
  }

  // 探索（与 nuwax-exploration LCM channel 接口对应）
  rpc GetFrontiers(Empty) returns (FrontierList);
  rpc SubscribeFrontiers(Empty) returns (stream FrontierList);
  // Phase 5 additive: 探索 start/stop/state/diagnostics。
  // 返回 ExplorationState.status 取值：
  //   "ACCEPTED"   — controller 已 begin，调用方进入 active 状态
  //   "REJECTED"   — request 被拒绝（NoSources / AlreadyActive / etc.）
  //   "PENDING"    — controller 暂时没有可用 goal（wavefront / source pending）
  //   "STOPPED"    — 已 stop，message 含 stop reason
  //   "UNIMPLEMENTED" — Phase 5 stub 暂未接通 nuwax-exploration crate
  rpc StartExploration(ExploreRequest) returns (ExplorationState);
  rpc StopExploration(StopExplorationRequest) returns (ExplorationState);
  rpc GetExplorationState(Empty) returns (ExplorationState);
  rpc GetExplorationDiagnostics(Empty) returns (ExplorationDiagnostics);

  // 输入发布兼容
  rpc PublishOdom(PublishOdomRequest) returns (PublishResult);
  rpc PublishPointCloud(PublishPointCloudRequest) returns (PublishResult);
}
