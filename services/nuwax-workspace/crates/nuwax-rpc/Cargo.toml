[package]
name = "nuwax-rpc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "nuwax RPC 抽象"

[dependencies]
nuwax-types = { path = "../nuwax-types" }
nuwax-core = { path = "../nuwax-core" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
nuwax-lcm = { path = "../nuwax-lcm", optional = true }

[features]
# 默认构建不链接系统 liblcm；RPC 核心仍可通过 RpcTransport 使用其它真实 transport。
# 启用后提供 LcmRpcTransport，它直接复用 nuwax-lcm 的单 owner 安全接口。
link-liblcm = ["dep:nuwax-lcm", "nuwax-lcm/link-liblcm"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
pretty_assertions = { workspace = true }
