version: "3.9"

services:
  nuwax-relay:
    image: python:3.12-slim
    container_name: nuwax-relay
    working_dir: /workspace/nuwax_robot_bridge
    volumes:
      - ../:/workspace/nuwax_robot_bridge:ro
      - ${NUWAX_INSTALL_HOME}/run:/neh/run:ro
    command:
      - python
      - -m
      - uvicorn
      - gateways.app:create_relay_app_from_env
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "9766"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NUWAX_INSTALL_HOME: /neh
    restart: unless-stopped
