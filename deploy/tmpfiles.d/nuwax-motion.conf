# Runtime transport directory shared by the guard and its authenticated clients.
d /run/nuwax 0750 nuwax-motion-guard nuwax-motion-clients -
r /run/nuwax/motion-guard.sock - - - -
z /run/nuwax/motion-guard.lock 0600 nuwax-motion-guard nuwax-motion-guard -

# Durable records are provisioned with valid checksums by the installer. tmpfiles
# must never create empty JSON records; it only repairs metadata when they exist.
d /var/lib/nuwax/motion-guard 0700 nuwax-motion-guard nuwax-motion-guard -
z /var/lib/nuwax/motion-guard/provisioned.json 0400 nuwax-motion-guard nuwax-motion-guard -
z /var/lib/nuwax/motion-guard/epoch.json 0600 nuwax-motion-guard nuwax-motion-guard -
