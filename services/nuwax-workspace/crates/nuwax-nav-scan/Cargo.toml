[package]
name = "nuwax-nav-scan"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "路线引导的近场三次样条与三维机体轨迹"

[features]
# Explicit cross-crate observations only; no strategy or resource override.
local-guidance-qualification = ["profile"]
profile = ["dep:serde_json"]

[dependencies]
nuwax-nav-mls-planner = { path = "../nuwax-nav-mls-planner" }
nuwax-nav-pct = { path = "../nuwax-nav-pct" }
nuwax-nav-types-messages = { path = "../nuwax-nav-types-messages" }
tracing.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
nuwax-map-chunks = { path = "../nuwax-map-chunks" }
