syntax = "proto3";
package nuwax.motion_guard.v3;

// ============================================================================
// 运动守卫协议 v3（F0 草案）
//
// 对应：目标架构第 5 节（三条底线 + 运动代次）。替代 services/navigation/proto/motion_guard.proto（v2）。
// 服务端：Python 守卫进程 services/navigation/motion_safety_guard（python -m services.navigation.motion_safety_guard），
//         由业务监督者按需启动（ensure(["motion_guard"])）。
// 客户端：网关 services/navigation/motion_client.py（Python）；导航栈 crates/nuwax-motion-safety-guard（Rust）。
//
// 传输（沿用 v2）：Unix 流式套接字 ${NUWAX_MOTION_GUARD_SOCKET}（安装根 run/motion-guard.sock，文件权限 0660）。
//   每帧 = 4 字节大端无符号长度 + 一条 protobuf 消息；长度为 0 或超过 16 MiB 时服务端断开连接。
//   请求帧是 GuardRequest，应答帧是 GuardResponse。一条连接上严格一问一答、按序处理；客户端可保持长连接，
//   连接断开后重连即可（服务端不保存任何按连接或按请求的记录）。
//
// 三条底线（服务端行为，目标架构 5.1）：
//   1. 急停（Stop）立即发零速并作废当前租约，代次加一。
//   2. 租约持有者最后一次 Velocity 之后 0.75 秒未再发 Velocity，守卫发零速（租约仍有效，再发 Velocity 即恢复）。
//   3. 只接受当前租约的 Velocity / Release；Acquire 只接受当前代次。旧租约、旧代次一律拒收。
//
// 运动代次：一个 uint64。守卫启动时取随机初值；Begin、Stop、Sport 各使其加一。
//   每条新的运动命令受理时由网关 Begin 取得代次，随任务参数 → 导航目标/探索请求 → Geometry → 导航栈传给执行者；
//   执行者凭它 Acquire。代次过期说明有更新的命令或急停，执行者停止并上报“已被停止”。
//
// 已删除（相对 v2，目标架构 5.3）：boot_nonce 与租约元组、操作号与幂等重放（GetOperationResult）、
//   普通/优先两套操作记录、零速回执与重试退避、请求期限（issued/deadline）、对端凭据校验、api_version、
//   守卫自带单实例锁、Renew（由 Velocity 续租）、RevokeAndZero（即 Release）、
//   RevokeZeroAndSwitchMode 与 BodyPose（并入 Sport，见待决问题 Q8）。
// ============================================================================

// 租约申请方，用于状态显示与日志。机体动作与设置不需要租约，没有对应来源。
enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_NAV = 1;                // 导航栈（导航目标、探索子目标）
  SOURCE_GATEWAY_FOLLOW = 2;     // 网关人物跟随
  SOURCE_GATEWAY_RELATIVE = 3;   // 网关相对移动、楼层设施内移动
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_STALE_GENERATION = 1;  // Acquire 携带的代次不是当前代次（有更新的命令或急停）
  ERROR_CODE_LEASE_REVOKED = 2;     // 租约不是当前租约（已被更新的租约、急停、机体动作或释放作废）
  ERROR_CODE_NOT_READY = 3;         // 执行器未配置或未连接，message 写原因
  ERROR_CODE_ACTUATOR_FAILED = 4;   // 执行器执行失败，message 写原因
  ERROR_CODE_INVALID_ARGUMENT = 5;  // 请求内容不合法（解码处唯一一次校验）
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

// ---------------- 请求 ----------------

// 受理一条新的运动命令：代次加一，返回新代次。当前租约不变，直到新命令的执行者 Acquire
// （或 Stop / Sport）时才作废，因此换手时不会先停一下（沿用 2cdde220 的行为）。
// 调用方：网关 invoke 处理运动类能力时调用一次。
message BeginRequest {}

// 带当前代次申请租约。成功即作废上一个租约（上一持有者此后收到 LEASE_REVOKED），返回新租约号。
// 错误：STALE_GENERATION、NOT_READY。
message AcquireRequest {
  Source source = 1;
  uint64 generation = 2;
}

// 发送速度（机体坐标系），同时续租。只接受当前租约。
// 错误：LEASE_REVOKED、NOT_READY、ACTUATOR_FAILED。速度超限时按执行器限幅执行，应答 limited=true。
message VelocityRequest {
  uint64 lease_id = 1;
  double vx_mps = 2;
  double vy_mps = 3;
  double wz_rps = 4;
}

// 持有者释放租约：发零速，租约作废。只接受当前租约（LEASE_REVOKED 表示早已作废，调用方可忽略）。
message ReleaseRequest {
  uint64 lease_id = 1;
}

// 急停：立即零速，作废当前租约，代次加一。任何时候都接受，不需要租约或代次。
message StopRequest {
  string reason = 1;   // 记日志用
}

// 机体动作：收到即作废当前租约、发零速、代次加一（之前的命令及其执行者全部失效），然后执行动作。
// 不需要租约或代次；网关调用前先取消当前运动任务。
message SportRequest {
  oneof command {
    SportActionCommand action = 10;   // 站立、坐下、打招呼等
    BodyPoseCommand body_pose = 11;   // 机身姿态
    ControlMode control_mode = 12;    // 切换高层/低层控制模式
  }
}

// 机器人设置。不需要租约与代次，不改变代次。至少设置一项，否则 INVALID_ARGUMENT。
message SettingRequest {
  optional uint32 speed_level = 1;          // 速度档位，闭区间 [1, 3]
  optional bool obstacle_avoidance = 2;     // 实时避障开关
}

// 读取守卫状态。任何时候都接受。
message StatusRequest {}

message GuardRequest {
  oneof op {
    BeginRequest begin = 1;
    AcquireRequest acquire = 2;
    VelocityRequest velocity = 3;
    ReleaseRequest release = 4;
    StopRequest stop = 5;
    SportRequest sport = 6;
    SettingRequest setting = 7;
    StatusRequest status = 8;
  }
}

// ---------------- 应答 ----------------

message BeginResponse {
  uint64 generation = 1;
}

message AcquireResponse {
  uint64 lease_id = 1;
}

message VelocityResponse {
  bool limited = 1;   // 执行器按配置限幅；不是实测速度
}

message ReleaseResponse {}

message StopResponse {
  uint64 generation = 1;   // 急停后的新代次
  bool lease_revoked = 2;  // 急停时确有租约被作废
}

message SportResponse {
  uint64 generation = 1;       // 动作完成后的新代次
  ControlMode active_mode = 2; // 仅 control_mode 命令：切换后的模式
}

message SettingResponse {}

message StatusResponse {
  uint64 generation = 1;
  uint64 lease_id = 2;            // 当前租约，0 表示无
  Source lease_source = 3;        // 当前租约的申请方
  bool zeroed = 4;                // 当前输出为零速（无租约、已释放或 0.75 秒未续）
  bool ready = 5;                 // 执行器已配置并连接
  string reason = 6;              // ready=false 的原因
  MotionCommandLimits command_limits = 7;  // 导航栈表面跟随器用（照抄 v2）
}

message GuardResponse {
  // 设置时请求失败，下面的 result 不设置。
  Error error = 1;
  // 执行器实测运动（照抄 v2 的旁路测量）：有有效样本时附在任何应答上；导航栈规划器读取。
  // 不代表命令已执行，也不参与任何准入。
  MeasuredMotionFeedback measured_motion = 2;
  oneof result {
    BeginResponse begin = 10;
    AcquireResponse acquire = 11;
    VelocityResponse velocity = 12;
    ReleaseResponse release = 13;
    StopResponse stop = 14;
    SportResponse sport = 15;
    SettingResponse setting = 16;
    StatusResponse status = 17;
  }
}

// ---------------- 机体动作与设置（照抄 v2 枚举） ----------------

enum SportAction {
  SPORT_ACTION_UNSPECIFIED = 0;
  SPORT_ACTION_DAMP = 1;
  SPORT_ACTION_BALANCE_STAND = 2;
  SPORT_ACTION_STOP_MOVE = 3;      // 只零速（等价于急停中的零速部分，同样作废租约、代次加一）
  SPORT_ACTION_STAND_UP = 4;
  SPORT_ACTION_STAND_DOWN = 5;
  SPORT_ACTION_RECOVERY_STAND = 6;
  SPORT_ACTION_SIT = 7;
  SPORT_ACTION_RISE_SIT = 8;
  SPORT_ACTION_HELLO = 9;
  SPORT_ACTION_STRETCH = 10;
  SPORT_ACTION_DANCE_1 = 11;
  SPORT_ACTION_DANCE_2 = 12;
  SPORT_ACTION_FRONT_FLIP = 13;
  SPORT_ACTION_FRONT_JUMP = 14;
  SPORT_ACTION_FRONT_POUNCE = 15;
  SPORT_ACTION_LEFT_FLIP = 16;
  SPORT_ACTION_BACK_FLIP = 17;
  SPORT_ACTION_FREE_WALK = 18;
  SPORT_ACTION_HAND_STAND = 19;
  SPORT_ACTION_FREE_JUMP = 20;
  SPORT_ACTION_FREE_BOUND = 21;
  SPORT_ACTION_WALK_UPRIGHT = 22;
  SPORT_ACTION_CROSS_STEP = 23;
  SPORT_ACTION_SWITCH_JOYSTICK = 24;
  SPORT_ACTION_POSE = 25;
  SPORT_ACTION_CLASSIC_WALK = 26;
}

message SportActionCommand {
  SportAction action = 1;
  // 只用于开关类动作；一次性动作收到 false → INVALID_ARGUMENT。
  bool enabled = 2;
}

message BodyPoseCommand {
  double roll_rad = 1;
  double pitch_rad = 2;
  double yaw_rad = 3;
}

enum ControlMode {
  CONTROL_MODE_UNSPECIFIED = 0;
  CONTROL_MODE_HIGH_LEVEL = 1;
  CONTROL_MODE_LOW_LEVEL = 2;
}

// ---------------- 执行反馈与限幅（照抄 v2） ----------------

// 设备命令帧的实际限幅策略；平面变换与 Python MotionCommandLimits 使用同一系数。
message MotionCommandLimits {
  double max_linear_x_mps = 1;
  double max_linear_y_mps = 2;
  double max_angular_z_rps = 3;
  optional double max_planar_speed_mps = 4;
  string source = 5;
  string input_frame_id = 6;
  string limit_frame_id = 7;
  repeated double command_from_input_rotation = 8; // 按行排列的 2×2 矩阵
  double input_origin_in_command_x_m = 9;
  double input_origin_in_command_y_m = 10;
}

// 同一真实设备样本；速度属于 frame_id 机体参考点，不由命令回执构造。
// 接收/到期时间属于守卫主机的单调时钟。
message MeasuredMotionFeedback {
  string source_id = 1;
  uint64 source_timestamp_ns = 2;
  uint64 received_monotonic_ns = 3;
  uint64 valid_until_monotonic_ns = 4;
  string frame_id = 5;
  repeated double body_linear_xyz = 6;   // 恰好 3 项，米/秒
  repeated double body_angular_xyz = 7;  // 恰好 3 项，弧度/秒
  repeated double orientation_wxyz = 8;  // 可缺失；提供时恰好 4 项
}
