[package]
name = "nuwax-tf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "nuwax TF 坐标变换树"

[dependencies]
nuwax-types = { path = "../nuwax-types" }
nuwax-numeric = { path = "../nuwax-numeric" }
nalgebra = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
nuwax-codec = { path = "../nuwax-codec", optional = true }
nuwax-lcm = { path = "../nuwax-lcm", optional = true }
bytes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt", "sync", "time"] }

[features]
default = []
link-liblcm = [
    "dep:bytes",
    "dep:nuwax-codec",
    "dep:nuwax-lcm",
    "dep:tokio",
    "nuwax-lcm/link-liblcm",
]

[dev-dependencies]
pretty_assertions = { workspace = true }
approx = { workspace = true }
