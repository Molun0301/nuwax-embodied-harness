# Runtime and durable state all belong to the single project identity.
d /run/nuwax 0750 nuwax nuwax -
d /run/nuwax/navigation 0750 nuwax nuwax -
d /run/nuwax/geometry 0750 nuwax nuwax -
d /run/nuwax/gateway 0750 nuwax nuwax -
r /run/nuwax/motion-guard.sock - - - -
