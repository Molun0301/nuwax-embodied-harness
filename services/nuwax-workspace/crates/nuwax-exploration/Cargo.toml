[package]
name = "nuwax-exploration"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Exploration orchestration facade, goal-source arbitration, and navigation conversions."

[lib]
path = "src/lib.rs"

[features]
default = []
wavefront = ["dep:nuwax-explore-wavefront"]
surface = ["dep:nuwax-nav-mls-planner", "dep:nuwax-nav-pct-native", "dep:nuwax-nav-stack"]
runtime = ["dep:tokio"]
patrolling-conversions = ["dep:nuwax-nav-patrolling"]

[dependencies]
serde_json = { workspace = true }
nuwax-explore-routing = { path = "../nuwax-explore-routing" }
nuwax-explore-wavefront = { path = "../nuwax-explore-wavefront", optional = true }
nuwax-nav-mls-planner = { path = "../nuwax-nav-mls-planner", optional = true }
nuwax-nav-pct-native = { path = "../nuwax-nav-pct-native", optional = true }
nuwax-nav-stack = { path = "../nuwax-nav-stack", optional = true, default-features = false, features = ["mls"] }
nuwax-nav-types-messages = { path = "../nuwax-nav-types-messages" }
nuwax-nav-patrolling = { path = "../nuwax-nav-patrolling", optional = true }
nuwax-nav-base = { path = "../nuwax-nav-base" }
tokio = { workspace = true, optional = true, features = ["time"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
nuwax-map-chunks = { path = "../nuwax-map-chunks" }
nuwax-nav-runtime = { path = "../nuwax-nav-runtime" }
tracing-subscriber = { workspace = true }
