name: 设备接入与建议
description: 提出新设备接入或具体功能需求
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 要完成的使用场景
      description: 目标用户、设备、现有做法及遇到的限制。
    validations:
      required: true
  - type: textarea
    id: interfaces
    attributes:
      label: 可提供的数据和接口
      description: 新设备请说明传感器、时间坐标、厂商软件来源与许可、速度和停止接口。
  - type: textarea
    id: acceptance
    attributes:
      label: 怎样判断完成
      description: 预期结果、可复现输入、验证设备与限制。
    validations:
      required: true
