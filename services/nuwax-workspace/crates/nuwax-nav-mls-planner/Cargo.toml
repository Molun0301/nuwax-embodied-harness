[package]
name = "nuwax-nav-mls-planner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Pure Rust multi-level surface (MLS) 3D path planner, migrated from dimos-mls-planner without pyo3/lcm/dimos-module."

[lib]
name = "nuwax_nav_mls_planner"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "mls_planner_native"
path = "src/bin/mls_planner_native.rs"

[dependencies]
nuwax-explore-routing = { path = "../nuwax-explore-routing" }
# 注意:MLS core 不引入 nuwax-nav-types-messages / nuwax-nav-base 以保持独立编译
# Foundation lane 正在修复类型收敛;本 crate 沿用原 dimos-mls-planner 的纯类型策略
# 内部使用 (f32,f32,f32) 元组 / Point3 / VoxelKey;不引入 LCM / DDS / pyo3 / numpy
ahash = "0.8"
# 不可变地图快照共享未变化的集合页。
im = { version = "15.1.0", features = ["rayon"] }
tracing = { workspace = true }
# validator + validator_derive:`#[validate(...)]` 字段校验宏与 `derive` 提供的 Validate trait
validator = { workspace = true, features = ["derive"] }
image = { workspace = true }
imageproc = { workspace = true }
rayon = { workspace = true }
# P0-16: stamp_pair + bin 需要 thiserror/serde/serde_json
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
nuwax-codec = { path = "../nuwax-codec" }
nuwax-protocol = { path = "../nuwax-protocol" }
nuwax-transport = { path = "../nuwax-transport", features = ["real-lcm"] }

[dev-dependencies]
approx = { workspace = true }

[features]
default = []
# 占位 feature:不再实际启用 pyo3,保留以兼容 stack 的 feature 约定
python-bindings = []
