[package]
name = "nuwax-nav-visual-servoing"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "2D bbox visual servoing + 3D detection navigation（TF trait）"

[dependencies]
nuwax-core = { path = "../nuwax-core" }
# Foundation 共享类型 — 接入后允许跨 crate 共享 BoundingBox2D / Twist / PoseStamped 协议语义
nuwax-nav-types-messages = { path = "../nuwax-nav-types-messages" }
nuwax-nav-base = { path = "../nuwax-nav-base" }
nuwax-nav-visual-query = { path = "../nuwax-nav-visual-query" }

nuwax-numeric = { path = "../nuwax-numeric" }
nuwax-tf = { path = "../nuwax-tf" }
nuwax-codec = { path = "../nuwax-codec" }
nuwax-protocol = { path = "../nuwax-protocol", optional = true }
nuwax-transport = { path = "../nuwax-transport", default-features = false, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
link-liblcm = [
    "dep:futures",
    "dep:nuwax-protocol",
    "dep:nuwax-transport",
    "dep:tokio",
    "dep:tracing",
    "nuwax-tf/link-liblcm",
    "nuwax-transport/real-lcm",
]

[dev-dependencies]
pretty_assertions = { workspace = true }
approx = { workspace = true }

[[bin]]
name = "nuwax-person-follow"
path = "src/bin/nuwax-person-follow.rs"
required-features = ["link-liblcm"]
