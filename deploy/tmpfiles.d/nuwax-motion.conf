d /var/lib/nuwax/gateway/geometry 0750 nuwax nuwax -
d /var/lib/nuwax/gateway/geometry/mapping 0750 nuwax nuwax -
d /var/lib/nuwax/gateway/geometry/pcd 0750 nuwax nuwax -
d /var/lib/nuwax/gateway/ultralytics 0750 nuwax nuwax -
d /var/lib/nuwax/gateway/config 0750 nuwax nuwax -
d /var/lib/nuwax/gateway/cache 0750 nuwax nuwax -
d /var/log/nuwax/gateway 0750 nuwax nuwax -
f /tmp/cdds.LOG 0660 nuwax nuwax -
