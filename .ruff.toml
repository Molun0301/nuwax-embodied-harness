target-version = "py38"
line-length = 120


# 排除不参与 lint 的目录。
extend-exclude = [
    ".venv_model_download",
    "build",
    "dist",
]

[lint.flake8-quotes]
inline-quotes = "double"
docstring-quotes = "double"

[lint.pydocstyle]
convention = "google"

[lint.pyupgrade]
# Python 3.8 部署引导仍需在运行时解析注解，保留 typing 容器与 Optional。
keep-runtime-typing = true
