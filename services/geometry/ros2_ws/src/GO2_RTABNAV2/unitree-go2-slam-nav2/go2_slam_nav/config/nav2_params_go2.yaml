# Nav2 for GO2 + RTAB-Map localization (no AMCL / map_server).

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: go2_base_link
    odom_topic: /go2/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # GO2: BackUp in BT recovery only; normal FollowPath keeps min_vel_x=0 (no reverse).
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      - spin_error_code
      - backup_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      min_vel_y: 0.0
      # No backward in FollowPath; no lateral strafe on GO2.
      max_vel_x: 0.22
      max_vel_y: 0.0
      max_vel_theta: 0.28
      min_speed_xy: 0.08
      min_speed_theta: 0.08
      max_speed_xy: 0.22
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 15
      sim_time: 1.7
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.06
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.50
      Oscillation.scale: 15.0
      PathAlign.scale: 20.0
      GoalAlign.scale: 18.0
      PathDist.scale: 32.0
      GoalDist.scale: 32.0
      RotateToGoal.scale: 40.0
      RotateToGoal.slowing_factor: 5.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: go2_odom
      robot_base_frame: go2_base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # GO2 机身 70x31x40cm，规划 footprint 四周各 +5cm → 80x41cm
      footprint: "[[0.40, 0.205], [0.40, -0.205], [-0.40, -0.205], [-0.40, 0.205]]"
      # static_layer=/map_obstacles 提供已建图障碍；voxel_layer=/go2/cloud 补实时点云
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map_obstacles
        map_subscribe_transient_local: True
        subscribe_to_updates: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        # 原 0.80m + 5cm 障碍物膨胀
        inflation_radius: 0.85
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.04
        max_obstacle_height: 1.5
        mark_threshold: 0
        observation_sources: scan3d
        scan3d:
          topic: /go2/cloud
          min_obstacle_height: 0.04
          max_obstacle_height: 1.5
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.3
          obstacle_max_range: 3.5
          obstacle_min_range: 0.3
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: go2_base_link
      footprint: "[[0.40, 0.205], [0.40, -0.205], [-0.40, -0.205], [-0.40, 0.205]]"
      resolution: 0.05
      track_unknown_space: true
      # Route B only: /map_obstacles already fuses RTAB /map + /cloud_obstacles.
      # Do NOT add a live obstacle_layer here — ray clearing would erase static
      # walls and Navfn will plan straight through obstacles (see /plan in RViz).
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map_obstacles
        map_subscribe_transient_local: True
        subscribe_to_updates: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        # 原 0.80m + 5cm 障碍物膨胀
        inflation_radius: 0.85
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: go2_odom
    global_frame: map
    robot_base_frame: go2_base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.28
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.22, 0.0, 0.28]
    # Negative x: BackUp recovery only. No lateral strafe.
    min_velocity: [-0.22, 0.0, -0.28]
    max_accel: [1.0, 1.0, 1.0]
    max_decel: [-1.0, -1.0, -1.0]
    odom_topic: "/go2/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # sport_ctrl min_linear_speed 0.08 m/s; DWB min_speed_xy must match for goal approach
    velocity_timeout: 1.0