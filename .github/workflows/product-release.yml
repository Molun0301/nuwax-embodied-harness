name: NEH源码安装入口检查

# 云端只检查源码；机器人程序由设备取得固定提交后增量构建。
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ''
  PYTHONHOME: ''
  PYTHONNOUSERSITE: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source-entry:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            python: '3.8'
          - runner: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 检查单命令入口与目标解释器语法
        run: |
          bash -n get-neh.sh scripts/neh_private_install.sh
          python3 scripts/ci/check_pep604.py scripts/neh_bootstrap.py scripts/neh_source.py scripts/neh_source_build.py scripts/device_manager scripts/module_installer scripts/product_release
      - name: 仅从源码组装并导入管理程序
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          from scripts.neh_bootstrap import unpack_manager
          from scripts.neh_source import source_version
          from scripts.product_release.builder import build_manager
          root = pathlib.Path.cwd()
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'neh-source-entry'
          temporary.mkdir()
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          archive = temporary / 'manager.tar.gz'
          result = build_manager(root, archive, version=source_version(revision))
          assert result['revision'] == revision
          manager = temporary / 'manager'
          manager.mkdir()
          manifest = unpack_manager(archive, manager)
          assert manifest['version'] == source_version(revision)
          subprocess.run([sys.executable, '-S', '-m', 'scripts.device_manager', '--help'], cwd=manager, check=True)
          PY
      - name: 安装生命周期与增量缓存回归（离线）
        run: |
          python3 scripts/check_bootstrap_download.py
          python3 scripts/check_install_location.py
          python3 scripts/check_web_install_location.py
          node scripts/check_install_location_ui.cjs
          python3 scripts/check_device_install_lifecycle.py
          python3 scripts/check_bootstrap_recovery.py
          python3 scripts/check_model_preparation.py
          python3 scripts/check_install_storage.py
          python3 scripts/check_source_dependency_reuse.py
          python3 scripts/check_installer_protocol_compiler.py
          python3 scripts/check_installer_naming_identity.py
          python3 scripts/check_build_parallelism.py
