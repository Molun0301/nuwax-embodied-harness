[package]
name = "nuwax-motion-safety-guard"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "运动守卫私有协议、生产客户端与实测运动缓存"
publish = false

# 生产套接字和执行器由Python守卫进程拥有；本包提供协议绑定及导航客户端。

[dependencies]
nuwax-config = { path = "../nuwax-config" }
prost = { workspace = true }
rustix = { version = "1.1.4", features = ["time"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "sync", "net", "io-util"] }

[build-dependencies]
tonic-build = { workspace = true }

[features]
default = []
