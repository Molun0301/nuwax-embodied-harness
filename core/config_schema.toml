type = "string"
default = "http://127.0.0.1:18910"
description = "unitree-sim/1 设备管理服务地址。安装时从该设备读取实际标定与命令策略。"
consumers = ["drivers/unitree_sim/device.py:Device", "drivers/unitree_sim/configuration.py:configure"]
apply = "restart"

[unitree_sim.model]
type = "string"
choices = ["go2", "g1"]
default = "go2"
description = "设备当前机器人型号。Go2 使用 NEH 自带外形；G1 须在 robot.model_path 指定外形文件。"
consumers = ["drivers/unitree_sim/assembly.py:UnitreeSimAssembly", "drivers/unitree_sim/configuration.py:configure"]
apply = "restart"
