# Runtime transport directory shared by the guard and its authenticated clients.
d /run/nuwax 0750 nuwax-motion-guard nuwax-motion-clients -
d /run/nuwax/navigation 0750 nuwax-navigation nuwax-motion-clients -
d /run/nuwax/geometry 0750 nuwax-geometry nuwax-motion-clients -
d /run/nuwax/gateway 0750 nuwax-gateway nuwax-gateway -
r /run/nuwax/motion-guard.sock - - - -
z /run/nuwax/motion-guard.lock 0600 nuwax-motion-guard nuwax-motion-guard -

# Durable records are provisioned with valid checksums by the installer. tmpfiles
# must never create empty JSON records; it only repairs metadata when they exist.
d /var/lib/nuwax/motion-guard 0700 nuwax-motion-guard nuwax-motion-guard -
d /var/lib/nuwax/geometry-runtime 0700 nuwax-geometry nuwax-motion-clients -
d /var/lib/nuwax_robot_bridge 2770 root nuwax-motion-clients -
d /var/lib/nuwax/gateway 0750 nuwax-gateway nuwax-gateway -
d /var/lib/nuwax/gateway/artifacts 0750 nuwax-gateway nuwax-gateway -
d /var/lib/nuwax/gateway/maps 0750 nuwax-gateway nuwax-gateway -
d /var/lib/nuwax/gateway/memory 0750 nuwax-gateway nuwax-gateway -
d /var/lib/nuwax/gateway/geometry 0750 nuwax-gateway nuwax-gateway -
d /var/lib/nuwax/gateway/geometry/mapping 0750 nuwax-gateway nuwax-gateway -
d /var/lib/nuwax/gateway/geometry/pcd 0750 nuwax-gateway nuwax-gateway -
d /var/lib/nuwax/gateway/ultralytics 0750 nuwax-gateway nuwax-gateway -
d /var/lib/nuwax/gateway/config 0750 nuwax-gateway nuwax-gateway -
d /var/lib/nuwax/gateway/cache 0750 nuwax-gateway nuwax-gateway -
d /var/log/nuwax/gateway 0750 nuwax-gateway nuwax-gateway -
f /tmp/cdds.LOG 0660 root nuwax-motion-clients -
z /tmp/cdds.LOG 0660 root nuwax-motion-clients -
r /tmp/nuwax_cloudmap.mmap - - - -
r /tmp/nuwax_occupancy.mmap - - - -
z /var/lib/nuwax_robot_bridge/nuwax_cloudmap.mmap 0660 nuwax-geometry nuwax-motion-clients -
z /var/lib/nuwax_robot_bridge/nuwax_occupancy.mmap 0660 nuwax-geometry nuwax-motion-clients -
z /var/lib/nuwax_robot_bridge/forbidden_zones.json 0640 nuwax-gateway nuwax-motion-clients -
f /var/lib/nuwax_robot_bridge/geometry-owner.env 0640 nuwax-gateway nuwax-motion-clients -
z /var/lib/nuwax_robot_bridge/geometry-owner.env 0640 nuwax-gateway nuwax-motion-clients -
z /var/lib/nuwax/motion-guard/provisioned.json 0400 nuwax-motion-guard nuwax-motion-guard -
z /var/lib/nuwax/motion-guard/epoch.json 0600 nuwax-motion-guard nuwax-motion-guard -
