[package]
name = "nuwax-lio-backends"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Mutually exclusive FastLIO2 and Point-LIO estimator backends"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[[bin]]
name = "nuwax-fastlio2-backend"
path = "src/bin/fastlio2.rs"

[[bin]]
name = "nuwax-pointlio-backend"
path = "src/bin/pointlio.rs"

[[bin]]
name = "nuwax-mid360-pcap-to-lio-input"
path = "src/bin/mid360_pcap_to_lio_input.rs"
