[package]
name = "nuwax-nav-pct"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "点云层析代价、跨层A星搜索与可复用全局路线"

[features]
default = ["mls-adapter"]
mls-adapter = ["dep:nuwax-nav-mls-planner", "dep:nuwax-nav-types-messages", "dep:tracing"]

[dependencies]
nuwax-nav-types-messages = { path = "../nuwax-nav-types-messages", optional = true }
nuwax-nav-mls-planner = { path = "../nuwax-nav-mls-planner", optional = true }
ahash = "0.8"
tracing = { workspace = true, optional = true }
