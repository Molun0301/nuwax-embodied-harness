[package]
name = "nuwax-lcm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "nuwax real-LCM 安全包装 + 单 owner 事件线程，本 crate 是唯一 LCM 链路底座。"

[dependencies]
nuwax-lcm-sys = { path = "../nuwax-lcm-sys" }
bytes = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }

# 镜像必须装 liblcm-dev 1.3~1.5；
# 启用 link-liblcm 时 nuwax-lcm-sys build.rs 探测系统 liblcm 并 fail-fast。
# dev/CI 镜像必须装 liblcm-dev 1.3~1.5(版本锁 build.rs MAX_LCM_VERSION = "1.6")。
[features]
link-liblcm = ["nuwax-lcm-sys/link-liblcm"]
