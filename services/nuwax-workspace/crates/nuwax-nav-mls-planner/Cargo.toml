[package]
name = "nuwax-nav-mls-planner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "共享三维体素、实测地面、机体几何及前沿数据组件。"

[lib]
name = "nuwax_nav_mls_planner"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
nuwax-map-chunks = { path = "../nuwax-map-chunks" }
nuwax-types = { path = "../nuwax-types" }
nuwax-explore-routing = { path = "../nuwax-explore-routing" }
# 注意:MLS core 不引入 nuwax-nav-types-messages / nuwax-nav-base 以保持独立编译
# Foundation lane 正在修复类型收敛;本 crate 沿用原 dimos-mls-planner 的纯类型策略
# 内部使用 (f32,f32,f32) 元组 / Point3 / VoxelKey;不引入 LCM / DDS / pyo3 / numpy
ahash = "0.8"
# 不可变地图快照共享未变化的集合页。
im = { version = "15.1.0", features = ["rayon"] }
tracing = { workspace = true }
# validator + validator_derive:`#[validate(...)]` 字段校验宏与 `derive` 提供的 Validate trait
validator = { workspace = true, features = ["derive"] }
image = { workspace = true }
imageproc = { workspace = true }
rayon = { workspace = true }
# 地图错误类型与本地诊断使用的序列化支持。
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
approx = { workspace = true }

[features]
default = []
# Opt-in fixed-size, thread-local wall-time attribution for body queries.
body-query-profile = []
