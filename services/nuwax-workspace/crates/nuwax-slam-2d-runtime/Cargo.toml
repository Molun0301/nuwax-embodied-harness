[package]
name = "nuwax-slam-2d-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "二维算法的受管进程、LCM会话协议和输入配对"
[features]
default = []
worker = ["dep:nuwax-slam-toolbox", "dep:nuwax-slam-toolbox-sys"]
[dependencies]
sha2 = "0.10"
nuwax-codec = { path = "../nuwax-codec" }
nuwax-lcm = { path = "../nuwax-lcm", features = ["link-liblcm"] }
nuwax-rpc = { path = "../nuwax-rpc", features = ["link-liblcm"] }
nuwax-slam-toolbox-sys = { path = "../nuwax-slam-toolbox-sys", optional = true }
nuwax-slam-toolbox = { path = "../nuwax-slam-toolbox", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio.workspace = true
async-trait.workspace = true
bytes.workspace = true
base64 = "0.22"
uuid.workspace = true
nix = { version = "0.29", features = ["process", "signal"] }
[[bin]]
name = "nuwax-slam-2d-worker"
path = "src/main.rs"
required-features = ["worker"]
