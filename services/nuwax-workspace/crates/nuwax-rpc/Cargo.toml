[package]
name = "nuwax-rpc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "nuwax RPC 抽象"

[dependencies]
nuwax-types = { path = "../nuwax-types" }
nuwax-core = { path = "../nuwax-core" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# link-liblcm 默认关闭:dev / 静态验证场景不链 liblcm。
# 启用后,RpcBroker::serve() 才真正注册到 LCM transport;否则返 BackendUnavailable。
link-liblcm = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
pretty_assertions = { workspace = true }