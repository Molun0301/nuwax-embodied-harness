[package]
name = "nuwax-explore-tare-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Native-process bridge and typed waypoint schema for CMU TARE planner."

[lib]
path = "src/lib.rs"

[dependencies]
nuwax-nav-native-runner = { path = "../nuwax-nav-native-runner" }
nuwax-nav-base = { path = "../nuwax-nav-base" }
nuwax-nav-types-messages = { path = "../nuwax-nav-types-messages" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
nuwax-nav-test-fixtures = { path = "../nuwax-nav-test-fixtures" }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "nuwax-tare-core"
path = "src/bin/nuwax-tare-core.rs"
