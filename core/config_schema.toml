# D0 业务配置契约。合成 run/config.toml 时使用本文件的缺省值。
# 段和键名对应运行配置中的 [段] 和段内键。以下子表只存在于模式文件。
# min、max 默认包含端点。对应的 *_exclusive 为 true 时排除该端点。
# 数字使用有限值。未列上下界时沿用类型范围和说明中引用的现行输入契约。
# special_values 是数字之外允许的字面值，空字符串表示未声明覆盖。
# array 使用 items 指定元素类型。length 指定固定元素数量。
# sensitive 标记敏感值。设置读取与页面展示沿用现有脱敏要求。
# hot 表示网关内立即生效。外部进程的特殊生效范围写在相应说明中。
# 相对持久路径以部署的数据布局解析，按 D0 对照表保留受管安装的存储位置。

[robot.actuator_max_linear_mps]
type = "float"
min = 0.0
min_exclusive = true
max = 5.0
special_values = [""]
default = ""
description = "显式声明执行器平面速度上限（米/秒）。须与偏航上限和运动形式同时填写。三项留空时，Go2 使用官方速度上限。"
consumers = [
    "core/config.py:derived_values",
    "services/nuwax-workspace/crates/nuwax-config/src/sections.rs:Robot.actuator_max_linear_mps",
]
apply = "restart"

[robot.actuator_max_yaw_rps]
type = "float"
min = 0.0
min_exclusive = true
max = 12.566370614359172
special_values = [""]
default = ""
description = "显式声明执行器偏航上限（弧度/秒），最大为 4π。须与平面上限和运动形式同时填写。"
consumers = [
    "core/config.py:derived_values",
    "services/nuwax-workspace/crates/nuwax-config/src/sections.rs:Robot.actuator_max_yaw_rps",
]
apply = "restart"

[robot.actuator_motion_model]
type = "string"
choices = ["", "omnidirectional"]
default = ""
description = "执行器的基本运动方式，目前只支持 omnidirectional（可前后左右平移和原地转向）。须与两项速度上限同时填写，供三维导航使用。"
consumers = [
    "core/config.py:derived_values",
    "services/nuwax-workspace/crates/nuwax-config/src/sections.rs:Robot.actuator_motion_model",
]
apply = "restart"

