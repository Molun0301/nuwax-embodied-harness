[package]
name = "nuwax-nav-native-runner"
version = "0.1.0"
description = "native C++ 模块进程生命周期管理(启动/停止/轮询/构建策略/CLI 渲染)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nuwax-nav-base = { path = "../nuwax-nav-base" }
nuwax-nav-types-messages = { path = "../nuwax-nav-types-messages" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nuwax-nav-test-fixtures = { path = "../nuwax-nav-test-fixtures" }

[dev-dependencies]
nuwax-nav-test-fixtures = { path = "../nuwax-nav-test-fixtures" }
pretty_assertions = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
# mock-native binary 仅由 nuwax-nav-test-fixtures 在自身 [[bin]] 声明一次;
# 本 crate 通过 nuwax-nav-test-fixtures::mock_native_path() 共享 helper 定位产物,
# 避免重复声明 bin。nuwax-nav-test-fixtures 在这里既作为 [dependencies] 也作为
# [dev-dependencies] 是为了让 unit-test 与 integration-test 都能直接调用 helper。
